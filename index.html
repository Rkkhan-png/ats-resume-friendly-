<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Free ATS Resume Builder</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f4;--card:#fff;--tx:#17201e;--mu:#58645f;--bd:#d8dfdc;--ac:#0b6b5f;--acbg:#e3f2ef;--bad:#b3261e;--ok:#18794e;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111716;--card:#192220;--tx:#e6eeeb;--mu:#98a8a2;--bd:#2c3a37;--ac:#3fd0bb;--acbg:#16322d;--bad:#ff8a80;--ok:#5fd39b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111716;--card:#192220;--tx:#e6eeeb;--mu:#98a8a2;--bd:#2c3a37;--ac:#3fd0bb;--acbg:#16322d;--bad:#ff8a80;--ok:#5fd39b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Georgia,"Times New Roman",serif}
h1,h2,h3,button,label,input,textarea,select,.ui{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 16px 8px;max-width:1280px;margin:0 auto}
header h1{margin:0;font-size:1.5rem;letter-spacing:-.01em}
header p{margin:4px 0 0;color:var(--mu);font-size:.95rem}
.tabs{display:flex;gap:6px;padding:8px 16px;max-width:1280px;margin:0 auto}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font-size:.95rem;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ac);color:#fff;border-color:var(--ac)}
.app{max-width:1280px;margin:0 auto;padding:8px 16px 40px;display:grid;gap:16px}
.pane{display:none}
body[data-tab="edit"] #p-edit,body[data-tab="match"] #p-match,body[data-tab="prev"] #p-prev{display:block}
@media(min-width:960px){
 .app{grid-template-columns:minmax(380px,1fr) minmax(0,1.1fr);align-items:start}
 #p-prev{display:block!important;grid-column:2;grid-row:1;position:sticky;top:12px}
 #p-edit,#p-match{grid-column:1}
 body[data-tab="prev"] #p-edit{display:block}
 .tabs button[data-t="prev"]{display:none}
}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.card h2{font-size:1.05rem;margin:0 0 10px}
.row{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(max-width:520px){.row{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;color:var(--mu);margin-bottom:3px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:7px;background:var(--bg);color:var(--tx);font-size:.95rem}
textarea{min-height:90px;resize:vertical;line-height:1.45}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.f{margin-bottom:10px}
.item{border-top:1px dashed var(--bd);padding-top:12px;margin-top:12px}
.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:.9rem}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.del{color:var(--bad)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.hint{font-size:.82rem;color:var(--mu);margin:4px 0 0}
.score{font:700 2.4rem/1 system-ui,sans-serif}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{padding:3px 9px;border-radius:99px;font:.82rem system-ui,sans-serif;border:1px solid var(--bd)}
.chip.ok{background:var(--acbg);color:var(--ac);border-color:transparent}
.chip.no{color:var(--bad);border-color:var(--bad)}
ul.chk{list-style:none;padding:0;margin:8px 0 0;font:.92rem system-ui,sans-serif}
ul.chk li{padding:5px 0;border-bottom:1px solid var(--bd)}
.paper{overflow-x:auto}
#resume{background:#fff;color:#111;width:100%;max-width:820px;margin:0 auto;padding:36px 40px;border:1px solid var(--bd);min-height:520px;font-size:11pt;line-height:1.4}
#resume h1{font-size:22pt;margin:0;line-height:1.15}
#resume .t{font-size:12pt;margin:2px 0}
#resume .c{font-size:10pt;margin:4px 0 10px;color:#333}
#resume h2{font-size:11pt;margin:14px 0 5px;padding-bottom:2px;border-bottom:1.5px solid #111;letter-spacing:.02em}
#resume .h{display:flex;justify-content:space-between;gap:10px;font-weight:700}
#resume .h span:last-child{font-weight:400;white-space:nowrap}
#resume .s{font-style:italic}
#resume ul{margin:3px 0 8px;padding-left:20px}
#resume p{margin:3px 0}
#resume.classic{font-family:Georgia,"Times New Roman",serif}
#resume.modern{font-family:Arial,Helvetica,sans-serif}
#resume.modern h2{border:0;color:var(--rc,#0b6b5f);border-bottom:2px solid var(--rc,#0b6b5f)}
#resume.modern h1{color:var(--rc,#0b6b5f)}
#resume.compact{font-family:Arial,Helvetica,sans-serif;font-size:10pt;padding:26px 30px;line-height:1.3}
#resume.compact h2{margin-top:9px}
textarea.out{min-height:160px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}
#resume{-webkit-print-color-adjust:exact;print-color-adjust:exact}
#resume.centered{font-family:Georgia,"Times New Roman",serif}
#resume.centered .hd{text-align:center}
#resume.centered h2{text-align:center;border:0;border-top:1px solid #111;border-bottom:1px solid #111;padding:2px 0;letter-spacing:.08em;font-size:10.5pt}
#resume.band{font-family:Arial,Helvetica,sans-serif}
#resume.band .hd{background:var(--rc,#0b6b5f);color:#fff;margin:-36px -40px 14px;padding:26px 40px}
#resume.band .hd .c{color:#fff;margin-bottom:0}
#resume.band h2{border:0;color:var(--rc,#0b6b5f);font-size:12pt}
#resume.executive{font-family:Georgia,"Times New Roman",serif}
#resume.executive h1{color:var(--rc,#0b6b5f);font-size:26pt}
#resume.executive h2{border:0;border-left:4px solid var(--rc,#0b6b5f);padding:1px 0 1px 8px;background:#f2f4f3}
#resume.minimal{font-family:Arial,Helvetica,sans-serif;color:#222}
#resume.minimal h1{font-weight:400;font-size:24pt}
#resume.minimal h2{border:0;font-size:10pt;letter-spacing:.12em;margin:16px 0 4px;color:var(--rc,#0b6b5f)}
@media print{#resume.band .hd{margin:0 0 12px;padding:18px 20px}}
@media print{
 :root{padding:0}
 body{background:#fff}
 header,.tabs,#p-edit,#p-match,.noprint{display:none!important}
 .app{display:block;padding:0}
 #p-prev{display:block!important;position:static}
 #resume{border:0;max-width:none;padding:0}
 @page{margin:14mm}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
</head>
<body data-tab="edit">
<header>
 <h1>Free ATS Resume Builder</h1>
 <p>Plain, single-column layouts that applicant tracking systems read cleanly. Your data stays in this browser.</p>
</header>
<div class="tabs" role="group" aria-label="Sections">
 <button data-t="edit" aria-pressed="true">Edit</button>
 <button data-t="match" aria-pressed="false">Job match</button>
 <button data-t="prev" aria-pressed="false">Preview</button>
</div>
<main class="app">
 <section class="pane" id="p-edit"></section>
 <section class="pane" id="p-match">
  <div class="card">
   <h2>Check your resume against a job ad</h2>
   <label for="jd">Paste the job description</label>
   <textarea id="jd" style="min-height:160px" placeholder="Paste the full job ad here"></textarea>
   <div class="bar" style="margin:10px 0 0"><button class="btn pri" id="run">Check match</button></div>
  </div>
  <div class="card" id="res" hidden></div>
  <div class="card" id="rules"></div>
 </section>
 <section class="pane" id="p-prev">
  <div class="bar noprint">
   <select id="tpl" aria-label="Template" style="width:auto">
    <option value="classic">Classic (serif)</option>
    <option value="modern">Modern (sans, accent)</option>
    <option value="compact">Compact (one page)</option>
    <option value="centered">Centered (traditional)</option>
    <option value="band">Header band</option>
    <option value="executive">Executive (serif, accent)</option>
    <option value="minimal">Minimal (airy)</option>
   </select>
   <label class="ui" style="display:flex;align-items:center;gap:6px;margin:0">Accent <input type="color" id="acc" value="#0b6b5f" style="width:38px;height:34px;padding:2px"></label>
   <button class="btn pri" id="print">Save as PDF</button>
   <button class="btn" id="copy">Copy plain text</button>
  </div>
  <p class="hint noprint" id="msg" role="status">In the print window, choose “Save as PDF” as the destination.</p>
  <div class="paper"><article id="resume" class="classic"></article></div>
 </section>
</main>
<script>
var KEY='ats-resume-v1';
function sample(){return{
 name:'Rukhsar',title:'Front Desk & Admissions Officer',email:'',phone:'',loc:'Karachi, Pakistan',link:'',tpl:'classic',
 summary:'Healthcare administration professional experienced in patient admissions, insurance verification, corporate approvals and discharge coordination. Comfortable working in a Hospital Management System (HMS) and coordinating between departments to keep patient flow smooth.',
 exp:[
  {role:'Front Desk & Admissions Officer',co:'OMI Hospital',dates:'Apr 2025 – Present',b:'Process patient admissions and verify insurance details in the HMS\nSubmit insurance intimations and follow up on corporate approvals\nCoordinate ward transfers and discharges with nursing and billing teams'},
  {role:'Receptionist (OPD)',co:'National Medical Center',dates:'Nearly 3 years',b:'Registered outpatients and managed OPD front desk queries\nCoordinated with clinics and departments to keep appointments on schedule'}
 ],
 edu:[{deg:'',school:'',dates:''}],
 skills:'Patient admissions, Insurance verification, Corporate approvals, HMS data entry, Discharge coordination, Ward transfers, Interdepartmental coordination, Patient communication',
 certs:''
};}
var S=load()||sample();
function load(){try{var v=JSON.parse(localStorage.getItem(KEY));return v&&v.exp?v:null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(i){return document.getElementById(i)}

function inp(label,attr,val,type){return '<div class="f"><label>'+label+'</label><input '+attr+' value="'+esc(val)+'"'+(type?' type="'+type+'"':'')+'></div>'}
function form(){
 var h='<div class="card"><h2>Import your current CV</h2><label for="cvfile">Upload a PDF</label><input type="file" id="cvfile" accept="application/pdf,.pdf"><div id="upmsg" class="hint" role="status"></div><details style="margin-top:10px"><summary class="ui" style="cursor:pointer">Or paste your CV text</summary><textarea id="pastecv" style="min-height:120px;margin-top:8px"></textarea><div class="bar" style="margin:8px 0 0"><button class="btn" id="importpaste">Import pasted text</button></div></details><p class="hint">Your file is read inside this browser. It is never uploaded to any server, and the text is saved only on this device.</p></div><div class="card"><h2>Your details</h2><div class="row">'+
 inp('Full name','data-k="name"',S.name)+inp('Job title','data-k="title"',S.title)+
 inp('Email','data-k="email"',S.email,'email')+inp('Phone','data-k="phone"',S.phone,'tel')+
 inp('Location','data-k="loc"',S.loc)+inp('LinkedIn or website','data-k="link"',S.link)+
 '</div></div><div class="card"><h2>Summary</h2><textarea data-k="summary">'+esc(S.summary)+'</textarea><p class="hint">Two to three sentences. Mention your target role and strongest skills.</p></div>';
 h+='<div class="card"><h2>Experience</h2>';
 S.exp.forEach(function(e,i){
  h+='<div class="item"><div class="row">'+inp('Job title','data-l="exp" data-i="'+i+'" data-f="role"',e.role)+inp('Employer','data-l="exp" data-i="'+i+'" data-f="co"',e.co)+'</div>'+
  inp('Dates','data-l="exp" data-i="'+i+'" data-f="dates"',e.dates)+
  '<div class="f"><label>Achievements (one per line)</label><textarea data-l="exp" data-i="'+i+'" data-f="b">'+esc(e.b)+'</textarea></div>'+
  '<button class="btn del" data-del="exp" data-i="'+i+'">Remove job</button></div>';
 });
 h+='<div class="bar" style="margin:12px 0 0"><button class="btn" data-add="exp">Add job</button></div></div>';
 h+='<div class="card"><h2>Education</h2>';
 S.edu.forEach(function(e,i){
  h+='<div class="item"><div class="row">'+inp('Degree or course','data-l="edu" data-i="'+i+'" data-f="deg"',e.deg)+inp('School','data-l="edu" data-i="'+i+'" data-f="school"',e.school)+'</div>'+
  inp('Dates','data-l="edu" data-i="'+i+'" data-f="dates"',e.dates)+
  '<button class="btn del" data-del="edu" data-i="'+i+'">Remove</button></div>';
 });
 h+='<div class="bar" style="margin:12px 0 0"><button class="btn" data-add="edu">Add education</button></div></div>';
 h+='<div class="card"><h2>Skills</h2><textarea data-k="skills">'+esc(S.skills)+'</textarea><p class="hint">Separate with commas. Use the same wording as the job ad.</p></div>'+
 '<div class="card"><h2>Certifications</h2><textarea data-k="certs" style="min-height:70px">'+esc(S.certs)+'</textarea><p class="hint">One per line (optional).</p></div>'+
 '<div class="bar"><button class="btn del" id="reset">Reset to sample</button><button class="btn del" id="wipe">Delete my saved data</button></div>';
 $('p-edit').innerHTML=h;
}

function lines(t){return String(t||'').split('\n').map(function(x){return x.trim()}).filter(Boolean)}
function resumeHTML(){
 var c=[S.email,S.phone,S.loc,S.link].filter(Boolean).map(esc).join(' | ');
 var h='<div class="hd"><h1>'+esc(S.name)+'</h1>'+(S.title?'<div class="t">'+esc(S.title)+'</div>':'')+(c?'<div class="c">'+c+'</div>':'')+'</div>';
 if(S.summary.trim())h+='<h2>Professional Summary</h2><p>'+esc(S.summary)+'</p>';
 var ex=S.exp.filter(function(e){return e.role||e.co});
 if(ex.length){h+='<h2>Work Experience</h2>';ex.forEach(function(e){
  h+='<div class="h"><span>'+esc(e.role)+'</span><span>'+esc(e.dates)+'</span></div><div class="s">'+esc(e.co)+'</div>';
  var b=lines(e.b);if(b.length)h+='<ul>'+b.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
 })}
 var ed=S.edu.filter(function(e){return e.deg||e.school});
 if(ed.length){h+='<h2>Education</h2>';ed.forEach(function(e){h+='<div class="h"><span>'+esc(e.deg)+'</span><span>'+esc(e.dates)+'</span></div><div class="s">'+esc(e.school)+'</div>'})}
 if(S.skills.trim())h+='<h2>Skills</h2><p>'+esc(S.skills)+'</p>';
 var ce=lines(S.certs);if(ce.length)h+='<h2>Certifications</h2><ul>'+ce.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
 return h;
}
function plain(){
 var o=[S.name,S.title,[S.email,S.phone,S.loc,S.link].filter(Boolean).join(' | '),''];
 if(S.summary.trim())o.push('PROFESSIONAL SUMMARY',S.summary.trim(),'');
 S.exp.forEach(function(e,i){if(!i)o.push('WORK EXPERIENCE');if(e.role||e.co){o.push(e.role+(e.co?', '+e.co:'')+(e.dates?' ('+e.dates+')':''));lines(e.b).forEach(function(x){o.push('- '+x)});o.push('')}});
 var ed=S.edu.filter(function(e){return e.deg||e.school});
 if(ed.length){o.push('EDUCATION');ed.forEach(function(e){o.push(e.deg+(e.school?', '+e.school:'')+(e.dates?' ('+e.dates+')':''))});o.push('')}
 if(S.skills.trim())o.push('SKILLS',S.skills.trim(),'');
 if(lines(S.certs).length)o.push('CERTIFICATIONS',lines(S.certs).join('\n'));
 return o.join('\n').trim();
}
function draw(){var r=$('resume');r.className=S.tpl||'classic';r.style.setProperty('--rc',S.acc||'#0b6b5f');$('acc').value=S.acc||'#0b6b5f';r.innerHTML=resumeHTML();$('tpl').value=S.tpl||'classic';rules()}

var STOP='a about above after again all also an and any are as at be because been before being below between both but by can could did do does doing down during each few for from further had has have having he her here hers him his how i if in into is it its just may me more most must my no nor not of off on once only or other our out over own same she should so some such than that the their them then there these they this those through to too under until up us very was we were what when where which while who whom why will with would you your able including etc within across well strong ability experience work working role team years year job company candidate position responsibilities requirements preferred required looking join new using use used'.split(' ');
function words(t){return (String(t).toLowerCase().match(/[a-z][a-z0-9+#.\-]{1,}/g)||[]).map(function(w){return w.replace(/[.\-]+$/,'')}).filter(function(w){return w.length>2})}
function allText(){return plain().toLowerCase()}
function rules(){
 var t=allText(),bul=[];S.exp.forEach(function(e){bul=bul.concat(lines(e.b))});
 var withNum=bul.filter(function(b){return /\d/.test(b)}).length;
 var L=[
  [/\S+@\S+\.\S+/.test(S.email),'Email address is present','Add a valid email address'],
  [S.phone.replace(/\D/g,'').length>=7,'Phone number is present','Add a phone number'],
  [S.loc.trim().length>0,'Location is present','Add your city and country'],
  [S.summary.trim().split(/\s+/).length>=25,'Summary has enough detail','Write a summary of at least 25 words'],
  [S.exp.some(function(e){return e.role&&e.co&&e.dates}),'Jobs have title, employer and dates','Fill in title, employer and dates for each job'],
  [bul.length>=4,'Experience has several bullet points','Add more achievement bullets (at least 4 in total)'],
  [bul.length>0&&withNum>0,'Some bullets include numbers ('+withNum+' of '+bul.length+')','Add numbers to bullets (patients per day, approvals handled, time saved). Only use figures that are true.'],
  [S.skills.split(',').filter(function(x){return x.trim()}).length>=6,'Skills section lists 6 or more skills','List at least 6 skills, separated by commas'],
  [S.edu.some(function(e){return e.deg||e.school}),'Education is listed','Add your education']
 ];
 var ok=L.filter(function(x){return x[0]}).length;
 $('rules').innerHTML='<h2>Resume health: '+ok+' of '+L.length+' checks passed</h2><ul class="chk">'+L.map(function(x){return '<li>'+(x[0]?'<span style="color:var(--ok)">Pass</span> – '+esc(x[1]):'<span style="color:var(--bad)">Fix</span> – '+esc(x[2]))+'</li>'}).join('')+'</ul>';
}
function match(){
 var jd=$('jd').value,r=$('res');
 if(jd.trim().split(/\s+/).length<15){r.hidden=false;r.innerHTML='<h2>Job match</h2><p>Paste a longer job description (at least 15 words) to get a score.</p>';return}
 var f={},w=words(jd),i,k;
 w.forEach(function(x){if(STOP.indexOf(x)<0)f[x]=(f[x]||0)+1});
 var keys=Object.keys(f).sort(function(a,b){return f[b]-f[a]||a.length-b.length}).slice(0,30);
 var rt=' '+words(allText()).join(' ')+' ';
 var hit=[],miss=[];
 keys.forEach(function(x){(rt.indexOf(' '+x+' ')>=0||rt.indexOf(' '+x)>=0&&x.length>5?hit:miss).push(x)});
 var sc=Math.round(hit.length/keys.length*100);
 var col=sc>=70?'var(--ok)':sc>=45?'var(--tx)':'var(--bad)';
 r.hidden=false;
 r.innerHTML='<h2>Job match</h2><div class="score" style="color:'+col+'">'+sc+'%</div><p class="hint">'+hit.length+' of the top '+keys.length+' keywords in the ad appear in your resume.</p>'+
 '<label style="margin-top:10px">Missing keywords</label><div class="chips">'+(miss.length?miss.map(function(x){return '<span class="chip no">'+esc(x)+'</span>'}).join(''):'<span class="hint">None. Nice.</span>')+'</div>'+
 '<label>Found in your resume</label><div class="chips">'+hit.map(function(x){return '<span class="chip ok">'+esc(x)+'</span>'}).join('')+'</div>'+
 '<p class="hint">Add a missing keyword only if it honestly describes your experience, in your summary, bullets or skills.</p>';
}

document.addEventListener('input',function(e){
 var t=e.target,d=t.dataset;
 if(d.k){S[d.k]=t.value}else if(d.l){S[d.l][+d.i][d.f]=t.value}else return;
 save();draw();
});
document.addEventListener('click',function(e){
 var t=e.target.closest('button');if(!t)return;var d=t.dataset;
 if(d.t){document.body.dataset.tab=d.t;document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-pressed',b===t?'true':'false')});if(d.t==='match')rules();return}
 if(d.add){S[d.add].push(d.add==='exp'?{role:'',co:'',dates:'',b:''}:{deg:'',school:'',dates:''});save();form();draw();return}
 if(d.del){S[d.del].splice(+d.i,1);if(!S[d.del].length)S[d.del].push(d.del==='exp'?{role:'',co:'',dates:'',b:''}:{deg:'',school:'',dates:''});save();form();draw();return}
 if(t.id==='reset'){if(confirm('Replace everything with the sample resume?')){S=sample();save();form();draw()}return}
 if(t.id==='wipe'){if(confirm('Delete everything saved in this browser and clear the form?')){try{localStorage.removeItem(KEY)}catch(x){}S=blank();form();draw();$('upmsg').textContent='All saved data deleted.'}return}
 if(t.id==='importpaste'){importText($('pastecv').value);return}
 if(t.id==='run'){match();return}
 if(t.id==='print'){try{window.print()}catch(x){$('msg').textContent='Printing is blocked here. Use “Copy plain text”, or open the page in your browser and print from the menu.'}return}
 if(t.id==='copy'){var tx=plain();
  var ok=function(){$('msg').textContent='Copied. Paste it into any document or job portal.'};
  var bad=function(){$('msg').textContent='Copy was blocked by the browser. Select the text in the preview and copy it manually.'};
  try{navigator.clipboard.writeText(tx).then(ok,bad)}catch(x){bad()}}
});
$('tpl').addEventListener('change',function(){S.tpl=this.value;save();draw()});
function blank(){return{name:'',title:'',email:'',phone:'',loc:'',link:'',tpl:S.tpl||'classic',summary:'',exp:[{role:'',co:'',dates:'',b:''}],edu:[{deg:'',school:'',dates:''}],skills:'',certs:''}}
var MON='(?:jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\\.?\\s*,?\\s*';
var YR='(?:'+MON+')?(?:19|20)\\d{2}';
var DATE=new RegExp(YR+'\\s*(?:-|–|—|to)\\s*(?:'+YR+'|present|current|now|till date|to date)','i');
var BUL=/^[•●▪■◦·*\-–—\uF0B7\uF0A7]\s*(.*)/;
var SEC=[['summary',/^(professional |career )?(summary|profile|objective)|^about me/i],['exp',/^(work |professional |employment |relevant )?(experience|history)|^employment/i],['edu',/^(education|academic|qualifications?)/i],['skills',/^(technical |core |key |professional )?(skills|competenc)/i],['certs',/^(certifications?|certificates|licen[sc]es|training|courses)/i],['other',/^(languages?|references?|projects?|awards?|achievements?|interests?|hobbies|volunteer|publications?)/i]];
var DEG=/bachelor|master|\bb\.?(sc|a|s|com|ba|ed)\b|\bm\.?(sc|a|s|com|ba|ed)\b|mba|diploma|degree|matric|intermediate|f\.?sc|phd|doctor|associate|certificate|a-level|o-level|hnd|bba|\bbs\b|\bms\b/i;
function secOf(l){var t=l.replace(/[:\s]+$/,'');if(t.length>40||t.split(/\s+/).length>3||/[.]$/.test(t))return null;for(var i=0;i<SEC.length;i++)if(SEC[i][1].test(t))return SEC[i][0];return null}
function unb(l){return l.replace(/^[•●▪■◦·*\-–—\uF0B7\uF0A7]\s*/,'')}
function importText(txt){
 var ls=String(txt).split('\n').map(function(x){return x.trim()}).filter(Boolean);
 if(ls.length<5){$('upmsg').textContent='No readable text found. If your PDF is a scanned image, paste the text below instead.';return}
 var sec={pre:[]},cur='pre';
 ls.forEach(function(l){var s=secOf(l);if(s){cur=s;sec[cur]=sec[cur]||[];return}(sec[cur]=sec[cur]||[]).push(l)});
 var all=ls.join(' '),pt=sec.pre.join(' | ');
 var em=(all.match(/[\w.+-]+@[\w-]+\.[\w.-]+/)||[''])[0];
 var ph=(pt.match(/\+?\d[\d\s().-]{7,}\d/)||[''])[0].trim();
 var lk=(all.match(/(?:https?:\/\/)?(?:www\.)?linkedin\.com\/[\w\-\/%]+/i)||[''])[0];
 var pre=sec.pre.filter(function(l){return l.indexOf('@')<0&&l.replace(/\D/g,'').length<7&&!/linkedin\.com|https?:/i.test(l)});
 var nm=pre[0]||'',tt=pre[1]||'',loc='';
 pt.split(/\s*[|•·]\s*/).forEach(function(p){if(!loc&&p&&p!==nm&&p!==tt&&p.indexOf('@')<0&&p.replace(/\D/g,'').length<3&&!/linkedin|https?:|www\./i.test(p)&&p.length<45&&/,/.test(p))loc=p});
 var jobs=[],hb=[],dt='',cj=null;
 function mk(){cj={role:hb[0]||'',co:hb.slice(1).join(', '),dates:dt,b:[],open:true};jobs.push(cj);hb=[];dt=''}
 (sec.exp||[]).forEach(function(l){
  var b=BUL.exec(l);
  if(b){if(!cj||!cj.open)mk();cj.b.push(b[1]);return}
  var dm=DATE.exec(l);
  if(cj&&cj.open&&!dm){var lb=cj.b[cj.b.length-1]||'';if(lb&&(/^[a-z]/.test(l)||(!/[.;:!]$/.test(lb)&&l.length>40))){cj.b[cj.b.length-1]=lb+' '+l;return}}
  if(cj&&cj.open)cj.open=false;
  if(dm){dt=dm[0];var rest=l.replace(dm[0],'').replace(/[|,()]+/g,' ').replace(/\s[-–—]\s*$/,'').trim();if(rest)hb.push(rest)}else hb.push(l);
 });
 if(hb.length)mk();
 var exp=jobs.map(function(j){return{role:j.role,co:j.co,dates:j.dates,b:j.b.join('\n')}});
 var edu=[],ce=null;
 (sec.edu||[]).forEach(function(l){var dm=DATE.exec(l)||/(?:19|20)\d{2}/.exec(l);var d=dm?dm[0]:'';var t=unb(l.replace(d,'')).replace(/[|,(–-]+\s*$/,'').trim();if(!t&&ce){if(d)ce.dates=d;return}if(DEG.test(t)||!ce){ce={deg:t,school:'',dates:d};edu.push(ce)}else{ce.school=ce.school?ce.school+', '+t:t;if(d&&!ce.dates)ce.dates=d}});
 var sk=(sec.skills||[]).map(unb).join(', ').replace(/,\s*,/g,',').replace(/:\s*,/g,': ');
 var cs=(sec.certs||[]).map(unb).join('\n');
 var sm=(sec.summary||[]).join(' ');
 var found=['summary','exp','edu','skills'].filter(function(k){return sec[k]&&sec[k].length}).length;
 if(!found)sm=ls.slice(2).join(' ').slice(0,1500);
 S={name:nm.length<=60?nm:'',title:tt.length<=80?tt:'',email:em,phone:ph,loc:loc,link:lk,tpl:S.tpl||'classic',summary:sm,
  exp:exp.length?exp:[{role:'',co:'',dates:'',b:''}],edu:edu.length?edu:[{deg:'',school:'',dates:''}],skills:sk,certs:cs};
 save();form();draw();
 $('upmsg').textContent='Imported '+ls.length+' lines into ATS-friendly sections ('+found+' of 4 main sections found). Check every field, then try the Job match tab.';
}
document.addEventListener('change',function(e){
 if(e.target.id!=='cvfile')return;
 var f=e.target.files[0];if(!f)return;
 var m=$('upmsg');
 if(!window.pdfjsLib){m.textContent='The PDF reader did not load. Paste your CV text below instead.';return}
 m.textContent='Reading your PDF in this browser…';
 try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}catch(x){}
 var rd=new FileReader();
 rd.onload=function(){
  pdfjsLib.getDocument({data:new Uint8Array(rd.result)}).promise.then(function(pdf){
   var ps=[];for(var i=1;i<=pdf.numPages;i++)ps.push(pdf.getPage(i).then(function(p){return p.getTextContent()}));
   return Promise.all(ps)}).then(function(pages){
   var out=[];
   pages.forEach(function(tc){var rows={};
    tc.items.forEach(function(it){if(!it.str.trim())return;var y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push(it)});
    Object.keys(rows).map(Number).sort(function(a,b){return b-a}).forEach(function(y){out.push(rows[y].sort(function(a,b){return a.transform[4]-b.transform[4]}).map(function(i){return i.str}).join(' ').replace(/\s+/g,' ').trim())})});
   importText(out.join('\n'))
  }).catch(function(){$('upmsg').textContent='Could not read this PDF. It may be password-protected or scanned. Paste the text below instead.'});
 };
 rd.readAsArrayBuffer(f);
});
$('acc').addEventListener('input',function(){S.acc=this.value;save();draw()});
form();draw();
</script>
